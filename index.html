<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Mi Restaurante - Sistema</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root{--bg:#f8fafc;--cd:#ffffff;--tx:#0f172a;--mu:#64748b;--ac:#0d9488;--ac-hover:#0f766e;--bd:#e2e8f0;--sh:0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05)}
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{margin:0;background:var(--bg);color:var(--tx);font-family:'Bricolage Grotesque',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
        .login-container{width:100%;max-width:420px;background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:32px;box-shadow:var(--sh)}
        .login-header{text-align:center;margin-bottom:28px}
        .login-header h1{font-size:26px;font-weight:800;color:var(--tx);margin:0 0 8px 0}
        .login-header p{color:var(--mu);font-size:14px;line-height:1.5;margin:0}
        .form-group{margin-bottom:20px}
        .form-group label{display:block;font-size:13px;font-weight:600;color:var(--tx);margin-bottom:8px}
        .form-control{width:100%;padding:12px 16px;font-size:15px;font-family:inherit;background:#f8fafc;border:1px solid var(--bd);border-radius:12px;color:var(--tx);transition:all 0.2s ease}
        .form-control:focus{outline:none;border-color:var(--ac);background:#fff;box-shadow:0 0 0 3px rgba(13, 148, 136, 0.15)}
        .btn-primary{width:100%;padding:14px;font-size:16px;font-weight:700;font-family:inherit;color:#fff;background:var(--ac);border:none;border-radius:12px;cursor:pointer;transition:background 0.2s ease, transform 0.1s ease;margin-top:8px}
        .btn-primary:hover{background:var(--ac-hover)}
        .btn-primary:active{transform:scale(0.98)}
        #app{width:100%;max-width:1200px;margin:0 auto}
    </style>
</head>
<body>
    <div id="login-screen" class="login-container">
        <div class="login-header">
            <h1>Mi Restaurante</h1>
            <p>Inicia sesión con tu cuenta asignada para acceder al sistema.</p>
        </div>
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" class="form-control" placeholder="usuario@restaurante.com" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" id="login-btn" class="btn-primary">Iniciar Sesión</button>
        </form>
    </div>

    <div id="app" style="display:none;">
        <!-- Panel principal del sistema -->
    </div>

    <script>
        const SUPABASE_URL = 'https://urhinovcskzbaknufbnr.supabase.co';
       const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVyaGlub3Zjc2t6YmFrbnVmYm5yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5ODc5NjMsImV4cCI6MjA4NjU2Mzk2M30.K023x2o4qR9PZ3z2k8V-s8v9_l3p2_z1x7v4c5b6n7m';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');

            btn.textContent = 'Iniciando sesión...';
            btn.disabled = true;

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                alert('Error al iniciar sesión: ' + error.message);
                btn.textContent = 'Iniciar Sesión';
                btn.disabled = false;
            } else {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                document.getElementById('app').innerHTML = `
                    <div style="text-align:center; padding: 40px; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05);">
                        <h2 style="color: #0d9488; margin-bottom: 10px;">¡Bienvenido al Sistema!</h2>
                        <p style="color: #64748b;">Sesión iniciada correctamente como: <b>${data.user.email}</b></p>
                        <button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px; background: #ef4444; color: white; border: none; border-radius: 8px; cursor: pointer;">Cerrar Sesión</button>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
