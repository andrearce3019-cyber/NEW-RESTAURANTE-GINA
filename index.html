function anular(ids,todo){const os=S.orders.filter(o=>ids.includes(o.id)&&o.st!='anulado');if(!os.length)return;
 const enCocina=os.some(o=>o.st=='prep'||o.st=='listo');
 let m=prompt((todo?'¿Anular TODO el pedido?':'¿Anular este envío ('+os[0].items.map(i=>i.q+' '+i.n).join(', ')+')?')+(enCocina?'\nOjo: cocina ya lo empezó a preparar.':'')+'\n\nEscribe el motivo de la anulación:');
 while(m!==null&&!m.trim())m=prompt('El motivo es obligatorio. ¿Por qué se anula?');
 if(m===null)return;const now=Date.now();os.forEach(o=>{o.st='anulado';o.ta=now;o.anuladoPor=myName;if(m.trim())o.motivo=m.trim()});
 const k=ck(os[0]),rest=S.orders.filter(o=>ck(o)==k&&!o.cerrada);if(todo||rest.every(o=>o.st=='anulado'))rest.forEach(o=>o.cerrada=true);

function parseChip(t,k){t=(t||'').trim();if(!t)return null;
 if(k=='sz'){const m=t.match(/^(.*?)\s*(?:s\/\.?\s*)?(\d+(?:[.,]\d+)?)$/i);if(!m||!m[1].trim()){alert('Escribe el tamaño y su precio.\nEjemplo: Chico 3');return null}return {n:m[1].trim(),p:+m[2].replace(',','.')}}
 const m=t.match(/^(.*?)\s*\+\s*(?:s\/\.?\s*)?(\d+(?:[.,]\d+)?)$/i);return m&&m[1].trim()?{n:m[1].trim(),p:+m[2].replace(',','.')}:{n:t,p:0}}
function chipsHTML(path,arr,k,rer){return `<div class="chips2">${arr.map((o,i)=>`<span class="chip2"><button class="g" title="Tocar para corregir" onclick="chipEd('${path}',${i},'${k}',${rer})">${esc(chipTxt(o,k))}</button><button class="g x" aria-label="Quitar" onclick="${path}.splice(${i},1);${rer}()">✕</button></span>`).join('')||`<span class="hint">${k=='sz'?'Sin tamaños.':'Aún no hay opciones.'}</span>`}</div>
 <div class="addr"><input data-path="${path}" placeholder="${k=='sz'?'Ej: Chico 3':'Escribe una opción y toca Agregar'}" onkeydown="if(event.key=='Enter'){event.preventDefault();chipAdd('${path}','${k}',this,${rer})}"><button class="p" onclick="chipAdd('${path}','${k}',this.previousElementSibling,${rer})">+ Agregar</button></div>`}
function chipAdd(path,k,inp,rer){const o=parseChip(inp.value,k);if(!o)return;getP(path).push(o);rer();const n=document.querySelector('[data-path="'+path+'"]');if(n)n.focus()}
function chipEd(path,i,k,rer){const a=getP(path),o=a[i],v=prompt(k=='sz'?'Corrige el tamaño y precio (ej: Grande 5):':'Corrige la opción. Si se cobra aparte, agrega + y el precio (ej: Huevo frito +1.50):',k=='sz'?o.n+' '+o.p:o.n+(+o.p?' +'+o.p:''));if(v==null)return;
 if(!v.trim()){a.splice(i,1);return rer()}const x=parseChip(v,k);if(x){a[i]=x;rer()}}

 <div class="card tw hfull"><table class="hT"><tr><th>N°</th><th>Fecha</th><th>Hora</th><th>Tipo</th><th>Mesa</th><th>Mozo</th><th>Cliente</th><th>Categoría</th><th>Producto</th><th>Cant.</th><th>P. unit.</th><th>P. lista</th><th>Variación</th><th>Monto</th><th>Estado</th><th>Pago</th><th>Cobró</th><th>Preparó</th><th>Prep.</th><th>Motivo</th></tr>${os.map(o=>itF(o).map(it=>`<tr${o.st=='anulado'?' style="opacity:.6"':''}><td><b>${pnum(o)}</b></td><td>${fec(o.t0)}</td><td>${hhmm(o.t0)}</td><td>${tipoTag(o)}</td><td>${mcorto(o.mesa)}</td><td>${esc(o.mozo||'—')}</td><td>${esc(o.cliente||'—')}</td><td><span style="color:${ccol(catItem(it))};font-weight:700">${esc(catItem(it))}</span></td><td>${esc(it.n)}</td><td>${it.q}</td><td>${money(it.p)}</td><td>${it.b!=null?money(it.b):'—'}</td><td>${varTag(it)}</td><td>${money(it.p*it.q)}</td><td>${o.st=='anulado'?'<b style="color:#c0392b">Anulado</b>':stTxt[o.st]||o.st}${o.corr?' <span class="chip" style="--c:#2b7fd0">✏️ Corregido</span>':''}</td><td>${o.st=='anulado'?'—':o.fiado&&!o.cerrada?'<span class="chip" style="--c:#a8740a">Pendiente</span>':pagoTag(o.pago)}</td><td>${esc(o.cobrador||'—')}</td><td>${esc(o.cocinero||(o.dir?'Directo':'—'))}</td><td>${o.t2&&o.t1?mm(o.t2-o.t1):'—'}</td><td>${o.st=='anulado'?'<b style="color:#c0392b">'+esc(o.motivo||'Anulado')+'</b>'+(o.anuladoPor?' · '+esc(o.anuladoPor):''):o.corr?'Corrección: '+esc(ultCorr(o)):''}</td></tr>`).join('')).join('')||'<tr><td colspan="21" class="hint">No hay pedidos con esos filtros.</td></tr>'}</table></div>`;
}
async function exportar(){
 const os=histList();if(!os.length)return alert('No hay pedidos para exportar.');
 const rows=[['N° pedido','Fecha','Hora','Tipo','Mesa','Mozo','Cliente','Categoría','Producto','Cantidad','Precio unitario','Precio lista','Variación (S/)','Monto','Estado','Método de pago','Motivo de anulación','Cocinero','Preparación (min)','Usuario','Pendiente a nombre de','Dejado pendiente por']];
 os.forEach(o=>itF(o).forEach(i=>rows.push([pnum(o),fec(o.t0),hhmm(o.t0),tipoTxt(o),mtxt(o.mesa),o.mozo||'',o.cliente||'',catItem(i),i.n,i.q,i.p,i.b!=null?i.b:'',i.b!=null?Math.round((i.p-i.b)*100)/100:'',o.st=='anulado'?0:i.p*i.q,stTxt[o.st]||o.st,o.st=='anulado'?'':(PAGOS[o.pago]?PAGOS[o.pago][0]:''),o.st=='anulado'?(o.motivo||''):o.corr?'Corrección: '+ultCorr(o):'',o.cocinero||'',o.t2&&o.t1?Math.round((o.t2-o.t1)/6000)/10:'',o.usr||'',o.fiado?(o.cliente||''):'',o.fiado?(o.fiadoPor||''):''])));
 const name='pedidos_'+(regCat?norm(regCat).replace(/\s+/g,'_')+'_':'')+dkey(Date.now());let data,fn;
 if(window.XLSX){const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[10,12,10,11,11,14,18,16,28,9,15,12,14,10,12,15,26,14,16,14,22,20].map(w=>({wch:w}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Pedidos');data=XLSX.write(wb,{type:'array',bookType:'xlsx'});fn=name+'.xlsx'}
 else{data='﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');fn=name+'.csv'}
 let dl=null;try{dl=window.claude&&claude.use?await claude.use('downloads'):null}catch(e){}
 if(dl){try{await dl.save({filename:fn,data})}catch(e){if(e&&e.code!='declined')alert('No se pudo guardar el archivo.')}return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=fn;document.body.appendChild(a);a.click();a.remove()}
function borrarMostrados(){
 const abiertas=new Set(S.orders.filter(o=>!o.cerrada).map(ck)),ls=histList().filter(o=>!abiertas.has(ck(o))),ids=new Set(ls.map(o=>o.id)),n=new Set(ls.map(ck)).size;
 if(!n)return alert('No hay pedidos cerrados en pantalla para borrar.');
 if(!confirm('Se borrarán '+n+' pedido(s) cerrados. Esta acción no se puede deshacer. ¿Ya exportaste a Excel?'))return;
 S.orders=S.orders.filter(o=>!ids.has(o.id));save();draw()}
init();
</script></body></html>
