<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Restaurante · Prototipo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#f1f5f3;--cd:#fff;--tx:#12211d;--mu:#5c6e68;--ac:#0b6b58;--ac2:#dcefe9;--on:#fff;--hd:#0b4f41;--ye:#f5b800;--wa:#a86a00;--ok:#1f7a45;--bd:#dbe3df;--sh:0 1px 2px #0001,0 6px 16px #0000000d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1614;--cd:#17221f;--tx:#e9f2ee;--mu:#9bb1a9;--ac:#2fb596;--ac2:#1b3a33;--on:#062018;--hd:#10251f;--wa:#f2b705;--ok:#58c785;--bd:#27382f}}
:root[data-theme="dark"]{--bg:#0e1614;--cd:#17221f;--tx:#e9f2ee;--mu:#9bb1a9;--ac:#2fb596;--ac2:#1b3a33;--on:#062018;--hd:#10251f;--wa:#f2b705;--ok:#58c785;--bd:#27382f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 'Bricolage Grotesque',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--bd);background:var(--cd);border-radius:10px;padding:8px 14px;min-height:42px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ye);outline-offset:2px}
button.p{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:700}
button:disabled{opacity:.45}button.g{border-color:transparent;color:var(--mu);background:transparent}
input,select,textarea{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;width:100%;min-height:42px}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--hd);color:#fff;border-bottom:3px solid var(--ac)}
.top b{font-size:18px;font-weight:800;flex:1}.top button{background:transparent;color:#fff;border-color:currentColor;min-height:36px;padding:4px 12px}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;border-radius:99px;flex:none}
.tabs button.on{background:var(--tx);color:var(--bg);border-color:var(--tx);font-weight:700}
.ctabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0}
.ctabs button{border-color:var(--c);color:var(--c);font-weight:600}
.ctabs button.on{background:var(--c);color:#fff;border-color:var(--c)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{position:relative;text-align:left;padding:0;overflow:hidden;border-radius:14px;box-shadow:var(--sh);display:flex;flex-direction:column;min-height:0}
.item:active{transform:scale(.97)}
.ph{height:84px;display:grid;place-items:center;font-size:38px;background:color-mix(in srgb,var(--c) 18%,var(--cd))}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.item strong{padding:8px 10px 0;font-size:15px;line-height:1.2}
.item span{padding:2px 10px 10px;font-weight:800}
.qty{position:absolute;top:6px;right:6px;background:var(--ac);color:var(--on);border-radius:99px;min-width:26px;height:26px;display:grid;place-items:center;font:700 14px system-ui;font-style:normal;box-shadow:var(--sh)}
.two{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px;align-items:start}
.two>div:last-child{position:sticky;top:12px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.mesas{display:flex;gap:8px;overflow-x:auto;margin-bottom:8px;scrollbar-width:none}.mesas button{flex:none}
.mesas button.on{background:var(--ye);color:#000;border-color:var(--ye);font-weight:800}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0}
.tag{font-size:13px;padding:3px 10px;border-radius:99px;background:var(--ac2);font-weight:600}
.col3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.kc{--k:#2b7fd0}.kc.prep{--k:#d9a400}.kc.listo{--k:#2a8a56}
.kc h3{margin:0 0 10px;padding-bottom:6px;border-bottom:3px solid var(--k)}
.kc .card{border-left:5px solid var(--k)}.kc .card button.p{min-height:48px;font-size:16px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}table{border-collapse:collapse;width:100%;min-width:560px}
td,th{padding:6px 4px;text-align:left;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-weight:600;white-space:nowrap}
.thumb{display:grid;place-items:center;width:56px;height:56px;border-radius:12px;background:var(--ac2);overflow:hidden;cursor:pointer;font-size:22px}.thumb img{width:100%;height:100%;object-fit:cover}
.bar{height:8px;background:var(--ac);border-radius:4px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi .card{margin:0}.kpi b{display:block;font-size:26px;font-weight:800}
.hint{color:var(--mu);font-size:14px}.late{color:var(--wa);font-weight:700}
.login{max-width:440px;margin:6vh auto;padding:16px}
.login h1{font-size:36px;font-weight:800;margin:0 0 6px}
.login button{display:flex;gap:14px;align-items:center;width:100%;text-align:left;margin-bottom:10px;padding:16px;border-radius:14px;box-shadow:var(--sh)}
.ic{font-size:30px;width:52px;height:52px;display:grid;place-items:center;border-radius:14px;background:var(--ac2)}
.mbar{display:none}
.two>div,.col3>div,.wrap{min-width:0}html,body{max-width:100%}body{overflow-x:clip}
@media(max-width:760px){
 .wrap{padding:12px 12px 96px}.two,.col3{grid-template-columns:minmax(0,1fr)}.two>div:last-child{position:static}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .mbar{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;justify-content:space-between;align-items:center;gap:8px;background:var(--tx);color:var(--bg);padding:8px 8px 8px 16px;border-radius:16px;box-shadow:0 6px 24px #0005}
 .mbar button{background:var(--ac);color:var(--on);border:0;font-weight:700}
 .top b{font-size:16px}.login{margin:3vh auto}
 .pt,.pt tbody{display:block;min-width:0}.pt tr:first-child{display:none}
 .pt tr{display:grid;grid-template-columns:60px minmax(0,1fr) minmax(0,1fr) 44px;gap:8px;padding:12px 0;border-bottom:1px solid var(--bd);grid-template-areas:"f n n n" "f c p a"}
 .pt td{border:0;padding:0}.pt td:nth-child(1){grid-area:f}.pt td:nth-child(2){grid-area:n}.pt td:nth-child(3){grid-area:c}.pt td:nth-child(4){grid-area:p}.pt td:nth-child(5){grid-area:a;align-self:center}
}
.top{flex-wrap:wrap}.top select{width:auto;min-height:36px;background:transparent;color:#fff;border-color:#fff9;padding:4px 8px}.top select option{color:#000}
.mesas button.oc:not(.on){border-color:var(--ac);font-weight:700}
.modal{position:fixed;inset:0;background:#0008;z-index:50;display:grid;place-items:center;padding:16px}
.sheet{width:min(560px,100%);max-height:85vh;overflow:auto;margin:0}
</style></head><body><div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const DEF=['Desayunos','Almuerzos','Postres','Helados','Jugos','Gaseosas'];let CATS=DEF;
const SEED=[['Pan con huevo y café','Desayunos',8],['Pan con chicharrón','Desayunos',12],['Tamal con jugo','Desayunos',10],['Menú del día','Almuerzos',14],['Lomo saltado','Almuerzos',22],['Arroz con pollo','Almuerzos',18],['Ají de gallina','Almuerzos',17],['Gelatina','Postres',4],['Mazamorra morada','Postres',5],['Torta de chocolate','Postres',9],['Helado de vainilla','Helados',5],['Helado de lúcuma','Helados',6],['Copa de helado','Helados',10],['Jugo de naranja','Jugos',6],['Jugo de papaya','Jugos',6],['Chicha morada','Jugos',5],['Inca Kola 500ml','Gaseosas',4],['Coca-Cola 500ml','Gaseosas',4]];
/* ===== PASO FINAL: pega aquí los 2 datos de tu proyecto Supabase ===== */
const SUPA_URL='https://urhinovcskzbaknufbnr.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVyaGlub3Zjc2t6YmFrbnVmYm5yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyOTE3MDAsImV4cCI6MjEwNjg2NzcwMH0.yr9QZmELXin-JiFHmjJS61nW5UuQoSmGxM32KaCUv7o';
/* ====================================================================== */
const ONLINE=/^https:\/\//.test(SUPA_URL);
let vista='admin';const rv=()=>user=='admin'?vista:user;
let sb=null,me=null,snap={},cfgSnap='',cfgVer=0,ver=0,busy=false,tm=null,ch=null;
const K='resto_proto_v1';
let S=load(),user=null,cat=CATS[0],mesa=1,cart={},nota='',atab='prod',cli='',hq='',hd1='',hd2='';
function load(){try{const s=JSON.parse(localStorage.getItem(K));if(s&&s.products){s.cats=s.cats||[...DEF];return s}}catch(e){}
 return {cats:[...DEF],products:SEED.map((p,i)=>({id:i+1,n:p[0],c:p[1],p:p[2],a:true})),orders:[],seq:1,pid:SEED.length+1}}
function save(){if(ONLINE){ver++;push();return}try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('No se pudo guardar: la memoria del navegador está llena. Quita algunas fotos o exporta y borra pedidos.')}}
CATS=S.cats;if(ONLINE){S={cats:[...DEF],products:[],orders:[],seq:1,pid:1};CATS=S.cats}
window.addEventListener('storage',e=>{if(e.key===K){S=load();CATS=S.cats;draw()}});
const $=s=>document.getElementById(s),money=n=>'S/ '+Number(n).toFixed(2);
const mm=ms=>{const s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const hhmm=t=>new Date(t).toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
const idn=o=>o.num!=null?o.num:(ONLINE?'…':String(o.id).slice(-5));
const fec=t=>new Date(t).toLocaleDateString('es-PE',{day:'2-digit',month:'2-digit',year:'numeric'});
const dkey=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const PAL=['#d9650f','#2a8a56','#c93a7a','#2b7fd0','#a8740a','#6f52c0','#12859a','#b94a28'];
const EMO={Desayunos:'🥐',Almuerzos:'🍛',Postres:'🍰',Helados:'🍨',Jugos:'🍹',Gaseosas:'🥤'};
const ccol=c=>PAL[Math.max(0,CATS.indexOf(c))%PAL.length],emo=c=>EMO[c]||'🍽️';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const total=o=>o.st=='anulado'?0:o.items.reduce((a,i)=>a+i.p*i.q,0);

/* ===== EN LÍNEA (Supabase) ===== */
function loginForm(){return `<div class="login"><h1>Mi Restaurante</h1><p class="hint">Ingresa con tu correo y contraseña.</p><div class="card"><input id="lu" type="email" placeholder="Correo electrónico" autocapitalize="none" autocomplete="username" style="margin-bottom:8px"><input id="lp" type="password" placeholder="Contraseña" autocomplete="current-password" onkeydown="if(event.key=='Enter')ingresar()" style="margin-bottom:10px"><button class="p" style="width:100%;display:block" onclick="ingresar()">Entrar</button></div></div>`}
async function init(){if(!ONLINE)return draw();
 sb=supabase.createClient(SUPA_URL,SUPA_KEY);
 const {data}=await sb.auth.getSession();if(data.session)await enter(data.session.user);else draw()}
async function ingresar(){const u=$('lu').value.trim().toLowerCase(),pw=$('lp').value;if(!u||!pw)return;
 const {data,error}=await sb.auth.signInWithPassword({email:u.includes('@')?u:u+'@resto.app',password:pw});
 if(error)return alert('Usuario o contraseña incorrectos.');await enter(data.user)}
async function enter(u){const {data}=await sb.from('perfiles').select('rol').eq('id',u.id).maybeSingle();
 if(!data){await sb.auth.signOut();alert('Este usuario no tiene un perfil asignado.');return draw()}
 me=u;user=data.rol;await pull();clearInterval(tm);tm=setInterval(pull,3000);
 if(ch)sb.removeChannel(ch);ch=sb.channel('rt').on('postgres_changes',{event:'*',schema:'public',table:'orders'},pull).subscribe();draw()}
async function salir(){clearInterval(tm);if(ch)sb.removeChannel(ch);await sb.auth.signOut();me=null;user=null;vista='admin';S.orders=[];snap={};draw()}
async function cambiarClave(){const p=prompt('Nueva contraseña (mínimo 6 caracteres):');if(!p)return;
 const {error}=await sb.auth.updateUser({password:p});alert(error?'No se pudo cambiar: '+error.message:'Contraseña cambiada.')}
async function push(){if(!sb||!me)return;busy=true;
 try{const d={cats:S.cats,products:S.products,pid:S.pid},cfg=JSON.stringify(d);
  if(user=='admin'&&cfg!==cfgSnap){const v=Date.now(),{error}=await sb.from('config').upsert({id:1,ver:v,data:d});if(error)throw error;cfgSnap=cfg;cfgVer=v}
  const cur={};S.orders.forEach(o=>cur[o.id]=JSON.stringify(o));
  const up=S.orders.filter(o=>snap[o.id]!==cur[o.id]).map(o=>({id:o.id,data:o})),del=Object.keys(snap).filter(k=>!(k in cur));
  if(up.length){const {error}=await sb.from('orders').upsert(up);if(error)throw error}
  if(del.length){const {error}=await sb.from('orders').delete().in('id',del);if(error)throw error}
  snap=cur}catch(e){alert('No se pudo guardar en línea. Revisa tu conexión e inténtalo de nuevo.')}
 busy=false}
async function pull(){if(!sb||!me||busy)return;const v=ver;
 try{const [c,o]=await Promise.all([sb.from('config').select('ver').eq('id',1).maybeSingle(),sb.from('orders').select('num,data').order('id',{ascending:false}).limit(1000)]);
  if(c.error||o.error||v!=ver||busy)return;
  const before=JSON.stringify([S.cats,S.products,S.orders]);
  if(c.data){if(c.data.ver!==cfgVer){const x=await sb.from('config').select('ver,data').eq('id',1).single();if(x.error||v!=ver)return;
    const d=x.data.data;S.cats=d.cats;CATS=S.cats;S.products=d.products;S.pid=d.pid;cfgSnap=JSON.stringify(d);cfgVer=x.data.ver}}
  else if(user=='admin'){S.cats=[...DEF];CATS=S.cats;S.products=SEED.map((q,i)=>({id:i+1,n:q[0],c:q[1],p:q[2],a:true}));S.pid=SEED.length+1;await push()}
  S.orders=o.data.map(x=>({...x.data,num:x.num})).reverse();snap={};S.orders.forEach(x=>snap[x.id]=JSON.stringify(x));
  if(JSON.stringify([S.cats,S.products,S.orders])!==before&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))draw()}catch(e){}}
function draw(){
 if(!user&&ONLINE){$('app').innerHTML=loginForm();return}
 if(!user){$('app').innerHTML=`<div class="login"><h1>Mi Restaurante</h1><p class="hint">Prototipo: elige un perfil para ver su pantalla. En la versión real cada persona entra con su usuario y contraseña.</p>
 <button onclick="login('mozo')"><span class="ic">🛎️</span><span><b>Mozo</b><br><span class="hint">Toma pedidos por mesa</span></span></button>
 <button onclick="login('cocina')"><span class="ic">👨‍🍳</span><span><b>Cocina</b><br><span class="hint">Recibe y prepara pedidos</span></span></button>
 <button onclick="login('admin')"><span class="ic">📊</span><span><b>Administrador</b><br><span class="hint">Productos, precios y reportes</span></span></button></div>`;return}
 const names={mozo:'Mozo',cocina:'Cocina',admin:'Administrador'};
 $('app').innerHTML=`<div class="top"><b>Mi Restaurante · ${names[rv()]}</b>${user=='admin'?`<select aria-label="Ir a" onchange="vista=this.value;draw()">${[['admin','Administrador'],['mozo','Mozo'],['cocina','Cocina']].map(o=>`<option value="${o[0]}" ${vista==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`:''}${ONLINE?`${user=='admin'?`<button onclick="cambiarClave()">Mi clave</button>`:''}<button onclick="salir()">Salir</button>`:`<button onclick="user=null;draw()">Cambiar perfil</button>`}</div><div class="wrap">${rv()=='mozo'?mozo():rv()=='cocina'?cocina():admin()}</div>`;
 document.querySelectorAll('.tabs button.on').forEach(b=>b.scrollIntoView({inline:'center',block:'nearest'}));
}
function login(r){user=r;draw()}

/* MOZO */
const stTxt={anulado:'Anulado',nuevo:'En espera',prep:'Preparando',listo:'Listo',entregado:'Entregado'};
const ck=o=>o.cuenta||o.id;
function cuentasAbiertas(){const g={};S.orders.filter(o=>!o.cerrada).forEach(o=>{(g[ck(o)]=g[ck(o)]||[]).push(o)});
 return Object.entries(g).map(([k,os])=>({k:+k,os:os.sort((x,y)=>x.t0-y.t0)})).sort((x,y)=>x.os[0].t0-y.os[0].t0)}
const cuentaDe=m=>cuentasAbiertas().find(c=>c.os[0].mesa==m);
const pnum=o=>{const r=S.orders.find(x=>x.id==ck(o));return idn(r||o)};
function mozo(){
 if(!CATS.includes(cat))cat=CATS[0];
 const prods=S.products.filter(p=>p.a&&p.c==cat);
 const lines=Object.entries(cart).map(([id,q])=>({p:S.products.find(x=>x.id==id),q})).filter(l=>l.p);
 const tot=lines.reduce((a,l)=>a+l.p.p*l.q,0),ab=cuentaDe(mesa),cs=cuentasAbiertas(),dis=lines.length?'':'disabled';
 return `<div class="mesas">${[1,2,3,4,5,6,7,8].map(n=>{const oc=cuentaDe(n);return `<button class="${n==mesa?'on':''}${oc?' oc':''}" onclick="mesa=${n};draw()">Mesa ${n}${oc?' •':''}</button>`}).join('')}</div>
 <div class="two"><div><div class="tabs ctabs">${CATS.map((c,i)=>`<button class="${c==cat?'on':''}" style="--c:${ccol(c)}" onclick="cat=CATS[${i}];draw()">${esc(c)}</button>`).join('')}</div>
 <div class="grid">${prods.map(p=>`<button class="item" style="--c:${ccol(p.c)}" onclick="add(${p.id})"><div class="ph">${p.img?`<img src="${p.img}" alt="">`:emo(p.c)}</div><strong>${esc(p.n)}</strong><span>${money(p.p)}</span>${cart[p.id]?`<i class="qty">${cart[p.id]}</i>`:''}</button>`).join('')||'<p class="hint">No hay productos activos en esta categoría.</p>'}</div></div>
 <div><div class="card" id="cart"><b>${ab?`Agregar al pedido ${pnum(ab.os[0])} · Mesa ${mesa}`:`Nuevo pedido · Mesa ${mesa}`}</b>
 ${ab?`<p class="hint" style="margin:4px 0">Esta mesa tiene una cuenta abierta: lo que envíes se suma a ese pedido.</p>`:''}
 ${lines.map(l=>`<div class="row"><span>${l.q} × ${esc(l.p.n)}</span><span><button class="g" onclick="add(${l.p.id},-1)">−</button><button class="g" onclick="add(${l.p.id})">+</button></span></div>`).join('')||'<p class="hint">Toca un producto para agregarlo.</p>'}
 ${ab?'':`<input placeholder="Nombre del cliente (opcional)" value="${esc(cli)}" oninput="cli=this.value" style="margin-bottom:6px">`}
 <textarea rows="2" placeholder="Observaciones (sin azúcar, para llevar…)" oninput="nota=this.value">${esc(nota)}</textarea>
 <div class="row"><b>Total</b><b>${money(tot)}</b></div>
 <button class="p" style="width:100%" ${dis} onclick="enviar(false)">Enviar a cocina</button>
 <button style="width:100%;margin-top:8px" ${dis} onclick="enviar(true)">Entregar directo (sin cocina)</button></div></div></div>
 <h3>Mesas abiertas</h3>${cs.map(cuentaCard).join('')||'<p class="hint">No hay mesas abiertas.</p>'}
 ${lines.length?`<div class="mbar"><span><b>${lines.reduce((a,l)=>a+l.q,0)}</b> productos · <b>${money(tot)}</b></span><button onclick="document.getElementById('cart').scrollIntoView({behavior:'smooth'})">Ver pedido</button></div>`:''}`;
}
function cuentaCard(c){const o0=c.os[0],tot=c.os.reduce((a,o)=>a+total(o),0);
 return `<div class="card"><div class="row"><b>Pedido ${pnum(o0)} · Mesa ${o0.mesa}${o0.cliente?' · '+esc(o0.cliente):''}</b><b>${money(tot)}</b></div>
 ${c.os.map(o=>`<div class="row" style="border-top:1px dashed var(--bd)"><span class="hint">${hhmm(o.t0)} · ${o.items.map(i=>i.q+' '+esc(i.n)).join(', ')}</span><span style="display:flex;gap:4px;align-items:center;flex:none">${o.st=='listo'?`<button class="p" onclick="avanzar(${o.id})">Entregar</button>`:`<span class="tag">${o.st=='anulado'?'Anulado':o.dir?'Directo':stTxt[o.st]}</span>`}${o.st!='anulado'?`<button class="g" title="Anular este envío" aria-label="Anular este envío" onclick="anular([${o.id}])">✕</button>`:''}</span></div>`).join('')}
 <div class="row" style="flex-wrap:wrap;justify-content:flex-end;margin-top:6px"><button onclick="verCuenta(${c.k})">Ver detalle</button><button onclick="mesa=${o0.mesa};draw();document.getElementById('cart').scrollIntoView({behavior:'smooth'})">Agregar</button><button style="color:#c0392b" onclick="anular(${JSON.stringify(c.os.map(o=>o.id))},true)">Anular pedido</button><button class="p" onclick="cerrar(${c.k})">Pedido entregado</button></div></div>`}
function verCuenta(k){const os=S.orders.filter(o=>ck(o)==k).sort((a,b)=>a.t0-b.t0);if(!os.length)return;
 const o0=os[0],tot=os.reduce((a,o)=>a+total(o),0),m=document.createElement('div');m.className='modal';m.onclick=e=>{if(e.target==m)m.remove()};
 m.innerHTML=`<div class="card sheet"><div class="row"><b style="font-size:22px">Pedido ${pnum(o0)}</b><button class="g" onclick="this.closest('.modal').remove()">Cerrar ✕</button></div>
 <p class="hint" style="margin:0 0 8px">Mesa ${o0.mesa}${o0.cliente?' · '+esc(o0.cliente):''} · ${fec(o0.t0)} ${hhmm(o0.t0)}</p>
 <table style="min-width:0"><tr><th>Producto</th><th>Cant.</th><th>P. unit.</th><th>Monto</th></tr>${os.map(o=>o.items.map(i=>`<tr><td>${esc(i.n)}<div class="hint">${hhmm(o.t0)} · ${o.st=='anulado'?'Anulado'+(o.motivo?': '+esc(o.motivo):''):o.dir?'Directo':stTxt[o.st]}</div></td><td>${i.q}</td><td>${money(i.p)}</td><td>${money(i.p*i.q)}</td></tr>`).join('')).join('')}</table>
 ${os.filter(o=>o.nota).map(o=>`<p class="hint">Nota: ${esc(o.nota)}</p>`).join('')}
 <div class="row" style="font-size:22px;margin-top:8px"><b>Total</b><b>${money(tot)}</b></div>
 <div class="row" style="flex-wrap:wrap;justify-content:flex-end;margin-top:10px"><button onclick="imprimir(${k})">🖨️ Imprimir</button><button class="p" onclick="whats(${k})">Enviar por WhatsApp</button></div></div>`;
 document.body.appendChild(m)}
const NEGOCIO='Restaurante Gina';
function tk(k){const os=S.orders.filter(o=>ck(o)==k).sort((a,b)=>a.t0-b.t0),it=[];
 os.filter(o=>o.st!='anulado').forEach(o=>o.items.forEach(i=>{const e=it.find(x=>x.n==i.n&&x.p==i.p);e?e.q+=i.q:it.push({...i})}));
 return {o0:os[0],it,tot:it.reduce((a,i)=>a+i.p*i.q,0)}}
function whats(k){const {o0,it,tot}=tk(k);let n=prompt('WhatsApp del cliente (ej. 987654321).\nDéjalo vacío para elegir el contacto en WhatsApp:');
 if(n===null)return;n=n.replace(/\D/g,'');if(n.length==9)n='51'+n;
 const t=`*${NEGOCIO}*\nPedido ${pnum(o0)} · Mesa ${o0.mesa}${o0.cliente?' · '+o0.cliente:''}\n${fec(o0.t0)} ${hhmm(o0.t0)}\n\n`+it.map(i=>`${i.q} x ${i.n} — ${money(i.p*i.q)}`).join('\n')+`\n\n*Total: ${money(tot)}*\n¡Gracias por su visita!`;
 window.open('https://wa.me/'+n+'?text='+encodeURIComponent(t),'_blank')}
function imprimir(k){const {o0,it,tot}=tk(k),w=window.open('','_blank');if(!w)return alert('Permite las ventanas emergentes para poder imprimir.');
 w.document.write(`<html><head><meta charset="utf-8"><title>Pedido ${pnum(o0)}</title><style>body{font:13px monospace;width:72mm;margin:0 auto;padding:8px;color:#000}h2{text-align:center;margin:4px 0}.r{display:flex;justify-content:space-between;gap:8px}hr{border:0;border-top:1px dashed #000}</style></head><body>
 <h2>${esc(NEGOCIO)}</h2><div style="text-align:center">Pedido ${pnum(o0)} · Mesa ${o0.mesa}<br>${fec(o0.t0)} ${hhmm(o0.t0)}${o0.cliente?'<br>Cliente: '+esc(o0.cliente):''}</div><hr>
 ${it.map(i=>`<div class="r"><span>${i.q} x ${esc(i.n)}</span><span>${money(i.p*i.q)}</span></div>`).join('')}<hr>
 <div class="r"><b>TOTAL</b><b>${money(tot)}</b></div><p style="text-align:center">¡Gracias por su visita!<br><small>No válido como comprobante de pago</small></p></body></html>`);
 w.document.close();w.focus();setTimeout(()=>w.print(),300)}
function anular(ids,todo){const os=S.orders.filter(o=>ids.includes(o.id)&&o.st!='anulado');if(!os.length)return;
 const enCocina=os.some(o=>o.st=='prep'||o.st=='listo');
 let m=prompt((todo?'¿Anular TODO el pedido?':'¿Anular este envío ('+os[0].items.map(i=>i.q+' '+i.n).join(', ')+')?')+(enCocina?'\nOjo: cocina ya lo empezó a preparar.':'')+'\n\nEscribe el motivo de la anulación:');
 while(m!==null&&!m.trim())m=prompt('El motivo es obligatorio. ¿Por qué se anula?');
 if(m===null)return;const now=Date.now();os.forEach(o=>{o.st='anulado';o.ta=now;if(m.trim())o.motivo=m.trim()});
 const k=ck(os[0]),rest=S.orders.filter(o=>ck(o)==k&&!o.cerrada);if(todo||rest.every(o=>o.st=='anulado'))rest.forEach(o=>o.cerrada=true);
 save();draw()}
function cerrar(k){const os=S.orders.filter(o=>ck(o)==k&&!o.cerrada),pend=os.filter(o=>o.st=='nuevo'||o.st=='prep').length;
 if(!confirm(pend?'Hay '+pend+' envío(s) que cocina aún no termina. ¿Marcar el pedido como entregado igual?':'¿Marcar el pedido como entregado? La mesa quedará libre.'))return;
 const now=Date.now();os.forEach(o=>{if(o.st=='listo'){o.st='entregado';o.t3=now}o.cerrada=true});save();draw()}
function add(id,d=1){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];draw()}
function enviar(dir){const items=Object.entries(cart).map(([id,q])=>{const p=S.products.find(x=>x.id==id);return p&&{n:p.n,p:p.p,q}}).filter(Boolean);if(!items.length)return;
 const ab=cuentaDe(mesa),now=Date.now(),o={id:now,mesa,cliente:ab?(ab.os[0].cliente||''):cli.trim(),items,nota,t0:now,cuenta:ab?ab.k:now};
 if(dir){o.st='entregado';o.dir=true;o.t3=now}else o.st='nuevo';
 S.orders.push(o);save();cart={};nota='';cli='';draw()}
function avanzar(id){const o=S.orders.find(x=>x.id==id),t=Date.now();
 if(o.st=='nuevo'){o.st='prep';o.t1=t}else if(o.st=='prep'){o.st='listo';o.t2=t}else if(o.st=='listo'){o.st='entregado';o.t3=t}
 save();draw()}

/* COCINA */
function cocina(){
 const col=(st,t,btn)=>{const os=S.orders.filter(o=>o.st==st).sort((a,b)=>a.t0-b.t0);
 return `<div class="kc ${st}"><h3>${t} (${os.length})</h3>${os.map(o=>{const ms=Date.now()-(st=='nuevo'?o.t0:st=='prep'?o.t1:o.t2);
 return `<div class="card"><div class="row"><b>P${pnum(o)} · Mesa ${o.mesa}${o.cliente?' · '+esc(o.cliente):''}${ck(o)!=o.id?' <span class="tag">Adicional</span>':''}</b><span class="${ms>600000&&st!='listo'?'late':'hint'}">${mm(ms)} · llegó ${hhmm(o.t0)}</span></div>
 ${o.items.map(i=>`<div>${i.q} × ${esc(i.n)}</div>`).join('')}${o.nota?`<div class="hint">Nota: ${esc(o.nota)}</div>`:''}
 ${btn?`<button class="p" style="margin-top:8px;width:100%" onclick="avanzar(${o.id})">${btn}</button>`:''}</div>`}).join('')||'<p class="hint">Nada por aquí.</p>'}</div>`};
 return `<div class="col3">${col('nuevo','Nuevos','Empezar a preparar')}${col('prep','Preparando','Marcar listo')}${col('listo','Listos para entregar','')}</div><p class="hint">El cronómetro se pone en ámbar pasados 10 minutos.</p>`;
}
setInterval(()=>{if(rv()=='cocina')draw()},15000);

function prodTab(){
 return `<div class="card"><b>Agregar producto</b><div class="row" style="flex-wrap:wrap"><input id="nn" placeholder="Nombre" style="flex:2;min-width:150px"><select id="nc" style="flex:1;min-width:110px">${CATS.map(c=>`<option>${esc(c)}</option>`).join('')}</select><input id="np" type="number" step="0.5" min="0" placeholder="Precio" style="flex:1;min-width:80px"><button class="p" onclick="addProd()">Agregar</button></div></div>
 ${catCard()}
 <div class="card tw"><table class="pt"><tr><th>Foto</th><th>Nombre</th><th>Categoría</th><th>Precio (S/)</th><th>Activo</th></tr>

function addCat(){const v=$('ncat').value.trim();if(!v)return;
 if(CATS.some(c=>c.toLowerCase()==v.toLowerCase()))return alert('Esa categoría ya existe.');
 S.cats.push(v);save();draw()}
function renCat(i,v){v=v.trim();const old=CATS[i];
 if(!v||CATS.some((c,j)=>j!=i&&c.toLowerCase()==v.toLowerCase())){alert('Escribe un nombre que no esté repetido.');return draw()}
 S.products.forEach(p=>{if(p.c==old)p.c=v});S.cats[i]=v;if(cat==old)cat=v;save();draw()}
function delCat(i){const old=CATS[i],n=S.products.filter(p=>p.c==old).length;
 if(n)return alert('"'+old+'" tiene '+n+' productos. Muévelos a otra categoría primero.');

function foto(id,f){if(!f)return;const im=new Image(),u=URL.createObjectURL(f);
 im.onload=()=>{const k=Math.min(1,320/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);S.products.find(x=>x.id==id).img=c.toDataURL('image/jpeg',.72);save();draw()};im.src=u}

function repTab(){
 const done=S.orders.filter(o=>o.st=='entregado'&&!o.dir),avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;

 return `<div class="kpi"><div class="card"><b>${money(vent)}</b><span class="hint">Ventas registradas</span></div><div class="card"><b>${S.orders.length}</b><span class="hint">Pedidos</span></div>
 <div class="card"><b>${mm(avg(S.orders.filter(o=>o.t1).map(o=>o.t1-o.t0)))}</b><span class="hint">Espera hasta empezar</span></div>

function demo(){const act=S.products.filter(p=>p.a),now=Date.now();

async function exportar(){
 const os=histList();if(!os.length)return alert('No hay pedidos para exportar.');
 const head=['Pedido','Fecha','Hora','Mesa','Cliente','Producto','Cantidad','Precio unitario','Monto','Estado','Motivo de anulación','Preparación (min)'];
 const rows=[head];let g=0;
 os.forEach(o=>o.items.forEach(i=>{g+=i.p*i.q;rows.push([pnum(o),fec(o.t0),hhmm(o.t0),o.mesa,o.cliente||'',i.n,i.q,i.p,o.st=='anulado'?0:i.p*i.q,o.st,o.st=='anulado'?(o.motivo||''):'',o.t2?Math.round((o.t2-o.t1)/6000)/10:''])}));
  const name='pedidos_'+dkey(Date.now());let data,fn;
 if(window.XLSX){const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[8,12,10,6,18,28,9,15,10,12,26,16].map(w=>({wch:w}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Pedidos');data=XLSX.write(wb,{type:'array',bookType:'xlsx'});fn=name+'.xlsx'}
 else{data='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');fn=name+'.csv'}
 let dl=null;try{dl=window.claude&&claude.use?await claude.use('downloads'):null}catch(e){}
 if(dl){try{await dl.save({filename:fn,data})}catch(e){if(e&&e.code!='declined')alert('No se pudo guardar el archivo.')}return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=fn;document.body.appendChild(a);a.click();a.remove()}
function borrarMostrados(){
 const ids=new Set(histList().filter(o=>o.st=='entregado'||o.st=='anulado').map(o=>o.id));
 if(!ids.size)return alert('No hay pedidos entregados en pantalla para borrar.');
 if(!confirm('Se borrarán '+ids.size+' pedidos entregados. Esta acción no se puede deshacer. ¿Ya exportaste a Excel?'))return;
 S.orders=S.orders.filter(o=>!ids.has(o.id));save();draw()}
init();
